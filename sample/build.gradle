plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yarolegovich.sample'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.yarolegovich.sample"
        minSdk 14
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation rootProject.ext.deps.androidxCore
    implementation rootProject.ext.deps.annotations
    implementation rootProject.ext.deps.androidxCompat
    implementation project(':library')
}

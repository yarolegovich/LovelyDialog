plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.yarolegovich.lovelydialog'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk 14
        targetSdk rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant("release")
    }
}

dependencies {
    api rootProject.ext.deps.annotations
    api rootProject.ext.deps.androidxCore
    api rootProject.ext.deps.androidxCompat
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.findByName('release')
                groupId = rootProject.ext.upload.groupId
                artifactId = 'lovely-dialog'
                version = rootProject.ext.upload.version
            }
        }
    }
}

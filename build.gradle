// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}


ext {
    compileSdkVersion = 34
    buildToolsVersion = '34.0.0'
    targetSdkVersion = 34
    minSdkVersion = 14

    upload = [
            user       : 'yarolegovich',
            userOrg    : 'yarolegovich',
            repository : 'maven',
            groupId    : 'com.yarolegovich',
            uploadName : 'LovelyDialog',
            description: 'This library is a set of simple wrapper classes that are aimed to help you easily create fancy dialogs.',
            version    : '1.1.1',
            licences   : ['Apache-2.0']
    ]

    deps = [
            androidxCore  : 'androidx.core:core:1.9.0',
            androidxCompat: 'androidx.appcompat:appcompat:1.6.1',
            annotations   : 'androidx.annotation:annotation:1.6.0'
    ]
}
